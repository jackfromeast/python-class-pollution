baseURL = "https://jackfromeast.github.io/python-class-pollution/"
locale = "en-us"
title = "Python Class Pollution"
theme = "hugo-book"

[params]
  BookTheme = "auto"
  BookToC = true
  BookSection = "docs"
  BookRepo = "https://github.com/jackfromeast/python-class-pollution"
  BookEditPath = "edit/main/wiki/content"
  BookSearch = true
  BookComments = false

[params.bookPortingGuide]
  enable = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
  [markup.highlight]
    style = "monokai"
    lineNos = false

[menu]
  [[menu.before]]
    name = "GitHub"
    url = "https://github.com/jackfromeast/python-class-pollution"
    weight = 10

[outputs]
  home = ["HTML", "RSS"]
