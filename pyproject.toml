[project]
name = "pyrl"
version = "0.1.0"
description = "Python class pollution vulnerability detection and analysis"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "psutil",
    "filelock",
    "pydantic",
]

[project.scripts]
pyrl = "pyrl.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrl"]
